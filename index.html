<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Key Free</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            border: 2px solid #ff8800;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 60px #ff880033;
            text-align: center;
        }
        h1 {
            color: #ff8800;
            font-size: 28px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 30px #ff880066;
        }
        .sub {
            color: #ff8800;
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 30px;
        }
        .key-display {
            background: #0d0d0d;
            border: 2px solid #00ff88;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            position: relative;
        }
        .key-label {
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .key-value {
            color: #00ff88;
            font-size: 42px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 8px;
            word-break: break-all;
            margin: 10px 0;
            text-shadow: 0 0 20px #00ff8844;
        }
        .key-status {
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin: 5px 0;
        }
        .status-waiting {
            background: #ff880022;
            color: #ff8800;
            border: 1px solid #ff8800;
        }
        .status-active {
            background: #00ff8822;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .status-expired {
            background: #ff334422;
            color: #ff3344;
            border: 1px solid #ff3344;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 120px;
        }
        .btn-copy {
            background: #ff8800;
            color: #0a0a0a;
        }
        .btn-copy:hover {
            background: #dd7700;
            box-shadow: 0 0 30px #ff880066;
            transform: scale(1.02);
        }
        .btn-spam {
            background: #ff3344;
            color: #fff;
        }
        .btn-spam:hover {
            background: #cc2233;
            box-shadow: 0 0 30px #ff334466;
            transform: scale(1.02);
        }
        .btn-activate {
            background: #00ff88;
            color: #0a0a0a;
        }
        .btn-activate:hover {
            background: #00dd77;
            box-shadow: 0 0 30px #00ff8866;
            transform: scale(1.02);
        }
        .btn-activate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .copy-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #00ff88;
            color: #0a0a0a;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 999;
            display: none;
            animation: slideDown 0.5s ease;
            box-shadow: 0 0 30px #00ff8866;
        }
        @keyframes slideDown {
            from {
                transform: translate(-50%, -100px);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }
        .info-text {
            color: #888;
            font-size: 12px;
            margin-top: 10px;
        }
        .info-text a {
            color: #ff8800;
            text-decoration: none;
        }
        .info-text a:hover {
            text-decoration: underline;
        }
        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }
            .key-value {
                font-size: 28px;
                letter-spacing: 5px;
            }
            .btn {
                font-size: 13px;
                padding: 12px 15px;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>

<div class="copy-notification" id="copyNotification">✅ Đã sao chép key!</div>

<div class="container">
    <h1>🔑 GET KEY FREE</h1>
    <div class="sub">Chỉ tính giờ khi kích hoạt</div>

    <!-- Key Display -->
    <div class="key-display">
        <div class="key-label">🔑 KEY CỦA BẠN</div>
        <div class="key-value" id="currentKey">XXXXXXXXXX</div>
        <div class="key-status status-waiting" id="statusBadge">⏳ Chờ kích hoạt</div>
        <div style="margin-top:10px; font-size:13px; color:#888;" id="expiryInfo">⏳ Chưa kích hoạt</div>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
        <button class="btn btn-copy" id="copyBtn">📋 Sao Chép Key</button>
        <button class="btn btn-activate" id="activateBtn">✅ Kích Hoạt Key</button>
        <button class="btn btn-spam" id="spamBtn">🚀 Mở Web Spam</button>
    </div>

    <div class="info-text">
        ⚡ Key sẽ được lưu và tự động kích hoạt khi bạn mở Web Spam<br>
        <span style="color:#00aa66;">📌 Lưu ý: Mỗi key chỉ kích hoạt được 1 lần duy nhất</span>
    </div>
</div>

<script>
    (function() {
        // ========== CONFIG ==========
        const SPAM_WEB_URL = 'https://telegram-spam-pro.vercel.app/'; // Thay bằng URL web spam của bạn
        const STORAGE_KEY = 'all_keys_data';
        const ACTIVATED_KEYS_KEY = 'activated_keys'; // Lưu danh sách key đã kích hoạt

        // ========== DOM REFS ==========
        const currentKeyDisplay = document.getElementById('currentKey');
        const statusBadge = document.getElementById('statusBadge');
        const expiryInfo = document.getElementById('expiryInfo');
        const copyNotification = document.getElementById('copyNotification');
        const copyBtn = document.getElementById('copyBtn');
        const spamBtn = document.getElementById('spamBtn');
        const activateBtn = document.getElementById('activateBtn');

        // ========== UTILITY ==========
        function generateRandomKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let key = '';
            for (let i = 0; i < 10; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key;
        }

        function getAllKeys() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function saveAllKeys(keys) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(keys));
            } catch (e) {}
        }

        function getActivatedKeys() {
            try {
                const data = localStorage.getItem(ACTIVATED_KEYS_KEY);
                return data ? JSON.parse(data) : {};
            } catch (e) {
                return {};
            }
        }

        function saveActivatedKeys(activated) {
            try {
                localStorage.setItem(ACTIVATED_KEYS_KEY, JSON.stringify(activated));
            } catch (e) {}
        }

        // Tạo key mới
        function createNewKey() {
            // Xóa key cũ nếu có
            const oldKey = currentKeyDisplay.textContent;
            if (oldKey && oldKey !== 'XXXXXXXXXX') {
                // Không xóa key cũ, chỉ tạo mới
            }

            const newKey = generateRandomKey();
            const allKeys = getAllKeys();
            
            // Kiểm tra key đã tồn tại chưa
            const exists = allKeys.some(item => item.key === newKey);
            if (exists) {
                // Nếu trùng, tạo lại
                return createNewKey();
            }

            // Thêm key mới với trạng thái 'waiting'
            allKeys.unshift({
                key: newKey,
                createdAt: Date.now(),
                status: 'waiting',
                activatedAt: null,
                expiryTime: null
            });
            
            saveAllKeys(allKeys);
            
            currentKeyDisplay.textContent = newKey;
            statusBadge.textContent = '⏳ Chờ kích hoạt';
            statusBadge.className = 'key-status status-waiting';
            expiryInfo.textContent = '⏳ Chưa kích hoạt - Bấm "Kích Hoạt Key" để sử dụng';
            activateBtn.disabled = false;
            activateBtn.textContent = '✅ Kích Hoạt Key';
            
            return newKey;
        }

        // Kích hoạt key (lưu vào localStorage để web Spam đọc được)
        function activateCurrentKey() {
            const key = currentKeyDisplay.textContent;
            if (!key || key === 'XXXXXXXXXX') {
                alert('❌ Chưa có key!');
                return false;
            }

            // Kiểm tra key đã được kích hoạt chưa (từ danh sách đã kích hoạt)
            const activatedKeys = getActivatedKeys();
            if (activatedKeys[key]) {
                alert('⚠️ Key này đã được kích hoạt trước đó!');
                return false;
            }

            // Cập nhật trạng thái key trong danh sách
            const allKeys = getAllKeys();
            const found = allKeys.find(item => item.key === key);
            
            if (found) {
                if (found.status === 'active') {
                    alert('⚠️ Key đã được kích hoạt!');
                    return false;
                }
                found.status = 'active';
                found.activatedAt = Date.now();
                found.expiryTime = Date.now() + 60 * 60 * 1000; // 1 giờ
                saveAllKeys(allKeys);
            }

            // Lưu vào danh sách key đã kích hoạt
            activatedKeys[key] = {
                activatedAt: Date.now(),
                expiryTime: Date.now() + 60 * 60 * 1000,
                status: 'active'
            };
            saveActivatedKeys(activatedKeys);

            // Cập nhật giao diện
            statusBadge.textContent = '✅ Đã kích hoạt';
            statusBadge.className = 'key-status status-active';
            const timeRemaining = getTimeRemaining(Date.now() + 60 * 60 * 1000);
            expiryInfo.textContent = `⏳ Còn lại: ${timeRemaining}`;
            activateBtn.disabled = true;
            activateBtn.textContent = '✅ Đã Kích Hoạt';

            // Gửi thông báo
            showNotification(`✅ Key ${key} đã được kích hoạt thành công!`);
            
            // Thông báo cho web Spam bằng cách lưu vào localStorage (đã lưu ở trên)
            console.log('✅ Key đã được kích hoạt và lưu vào localStorage');
            
            return true;
        }

        function getTimeRemaining(expiry) {
            const diff = expiry - Date.now();
            if (diff <= 0) return 'Hết hạn';
            const hours = Math.floor(diff / (60 * 60 * 1000));
            const minutes = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
            if (hours > 0) return `${hours} giờ ${minutes} phút`;
            return `${minutes} phút`;
        }

        function showNotification(message) {
            copyNotification.style.display = 'block';
            copyNotification.textContent = message;
            setTimeout(() => {
                copyNotification.style.display = 'none';
            }, 3000);
        }

        // ========== COPY KEY ==========
        function copyCurrentKey() {
            const key = currentKeyDisplay.textContent;
            if (!key || key === 'XXXXXXXXXX') {
                alert('❌ Chưa có key!');
                return;
            }

            navigator.clipboard.writeText(key).then(() => {
                showNotification(`✅ Đã sao chép key: ${key}`);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = key;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showNotification(`✅ Đã sao chép key: ${key}`);
            });
        }

        // ========== KIỂM TRA KEY TỪ SPAM WEB ==========
        function checkKeyFromSpamWeb() {
            // Kiểm tra xem có key nào đã được kích hoạt từ web Spam không
            const activatedKeys = getActivatedKeys();
            const currentKey = currentKeyDisplay.textContent;
            
            if (currentKey && currentKey !== 'XXXXXXXXXX' && activatedKeys[currentKey]) {
                const data = activatedKeys[currentKey];
                if (data.status === 'active') {
                    statusBadge.textContent = '✅ Đã kích hoạt';
                    statusBadge.className = 'key-status status-active';
                    const timeRemaining = getTimeRemaining(data.expiryTime);
                    expiryInfo.textContent = `⏳ Còn lại: ${timeRemaining}`;
                    activateBtn.disabled = true;
                    activateBtn.textContent = '✅ Đã Kích Hoạt';
                }
            }
        }

        // ========== EVENT LISTENERS ==========
        copyBtn.addEventListener('click', copyCurrentKey);

        activateBtn.addEventListener('click', activateCurrentKey);

        spamBtn.addEventListener('click', function() {
            // Mở web spam trong tab mới
            window.open(SPAM_WEB_URL, '_blank');
        });

        // ========== CHECK KÍCH HOẠT TỪ URL ==========
        function checkActivationFromURL() {
            const params = new URLSearchParams(window.location.search);
            const key = params.get('key');
            const action = params.get('action');
            
            if (action === 'activate' && key) {
                // Xóa params trên URL
                const newUrl = window.location.pathname + window.location.hash;
                window.history.replaceState({}, document.title, newUrl);
                
                // Hiển thị key và kích hoạt
                if (key) {
                    currentKeyDisplay.textContent = key.toUpperCase();
                    // Tự động kích hoạt
                    setTimeout(() => {
                        activateCurrentKey();
                    }, 500);
                }
                return true;
            }
            return false;
        }

        // ========== INIT ==========
        function init() {
            // Kiểm tra kích hoạt từ URL trước
            checkActivationFromURL();
            
            // Tạo key mới (mỗi lần vào web)
            createNewKey();
            
            // Kiểm tra key từ web Spam
            checkKeyFromSpamWeb();
            
            console.log('🔑 Key mới đã được tạo:', currentKeyDisplay.textContent);
            console.log('💡 Hướng dẫn: Bấm "Kích Hoạt Key" để kích hoạt key, sau đó mở Web Spam để sử dụng.');
        }

        // Chạy init
        init();

    })();
</script>
</body>
</html>
