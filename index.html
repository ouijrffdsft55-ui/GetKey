<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Key Free</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            border: 2px solid #ff8800;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 60px #ff880033;
            text-align: center;
        }
        h1 {
            color: #ff8800;
            font-size: 28px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 30px #ff880066;
        }
        .sub {
            color: #ff8800;
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 30px;
        }
        .key-display {
            background: #0d0d0d;
            border: 2px solid #00ff88;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            position: relative;
        }
        .key-label {
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .key-value {
            color: #00ff88;
            font-size: 42px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 8px;
            word-break: break-all;
            margin: 10px 0;
            text-shadow: 0 0 20px #00ff8844;
        }
        .key-status {
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin: 5px 0;
        }
        .status-waiting {
            background: #ff880022;
            color: #ff8800;
            border: 1px solid #ff8800;
        }
        .status-active {
            background: #00ff8822;
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 120px;
        }
        .btn-copy {
            background: #ff8800;
            color: #0a0a0a;
        }
        .btn-copy:hover {
            background: #dd7700;
            box-shadow: 0 0 30px #ff880066;
            transform: scale(1.02);
        }
        .btn-spam {
            background: #ff3344;
            color: #fff;
        }
        .btn-spam:hover {
            background: #cc2233;
            box-shadow: 0 0 30px #ff334466;
            transform: scale(1.02);
        }
        .copy-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #00ff88;
            color: #0a0a0a;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 999;
            display: none;
            animation: slideDown 0.5s ease;
            box-shadow: 0 0 30px #00ff8866;
        }
        @keyframes slideDown {
            from {
                transform: translate(-50%, -100px);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }
        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }
            .key-value {
                font-size: 28px;
                letter-spacing: 5px;
            }
            .btn {
                font-size: 13px;
                padding: 12px 15px;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>

<div class="copy-notification" id="copyNotification">✅ Đã sao chép key!</div>

<div class="container">
    <h1>🔑 GET KEY FREE</h1>
    <div class="sub">Chỉ tính giờ khi kích hoạt</div>

    <!-- Key Display -->
    <div class="key-display">
        <div class="key-label">🔑 KEY CỦA BẠN</div>
        <div class="key-value" id="currentKey">XXXXXXXXXX</div>
        <div class="key-status status-waiting" id="statusBadge">⏳ Chờ kích hoạt</div>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
        <button class="btn btn-copy" id="copyBtn">📋 Sao Chép Key</button>
        <button class="btn btn-spam" id="spamBtn">🚀 Mở Web Spam</button>
    </div>
</div>

<script>
    (function() {
        // ========== CONFIG ==========
        const SPAM_WEB_URL = 'https://telegram-spam-pro.vercel.app/'; // Thay bằng URL web spam của bạn
        const STORAGE_KEY = 'all_keys_data';

        // ========== DOM REFS ==========
        const currentKeyDisplay = document.getElementById('currentKey');
        const statusBadge = document.getElementById('statusBadge');
        const copyNotification = document.getElementById('copyNotification');
        const copyBtn = document.getElementById('copyBtn');
        const spamBtn = document.getElementById('spamBtn');

        // ========== UTILITY ==========
        // Tạo key chỉ gồm 10 chữ cái in hoa (A-Z)
        function generateRandomKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let key = '';
            for (let i = 0; i < 10; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key;
        }

        // Lấy tất cả key đã tạo từ localStorage
        function getAllKeys() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        // Lưu danh sách key
        function saveAllKeys(keys) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(keys));
            } catch (e) {}
        }

        // Tạo key mới
        function createNewKey() {
            // Tạo key ngẫu nhiên
            const newKey = generateRandomKey();
            
            // Lấy danh sách key hiện tại
            const allKeys = getAllKeys();
            
            // Thêm key mới vào đầu danh sách
            allKeys.unshift({
                key: newKey,
                createdAt: Date.now(),
                status: 'waiting', // waiting, active, expired
                activatedAt: null
            });
            
            // Lưu lại
            saveAllKeys(allKeys);
            
            // Cập nhật giao diện
            currentKeyDisplay.textContent = newKey;
            statusBadge.textContent = '⏳ Chờ kích hoạt';
            statusBadge.className = 'key-status status-waiting';
            
            return newKey;
        }

        // Kích hoạt key
        function activateKey(key) {
            const allKeys = getAllKeys();
            const found = allKeys.find(item => item.key === key);
            
            if (found) {
                found.status = 'active';
                found.activatedAt = Date.now();
                saveAllKeys(allKeys);
                
                // Nếu là key hiện tại, cập nhật badge
                if (key === currentKeyDisplay.textContent) {
                    statusBadge.textContent = '✅ Đã kích hoạt';
                    statusBadge.className = 'key-status status-active';
                }
                return true;
            }
            return false;
        }

        // ========== COPY KEY ==========
        function copyCurrentKey() {
            const key = currentKeyDisplay.textContent;
            if (!key || key === 'XXXXXXXXXX') {
                alert('❌ Chưa có key!');
                return;
            }

            navigator.clipboard.writeText(key).then(() => {
                copyNotification.style.display = 'block';
                copyNotification.textContent = `✅ Đã sao chép key: ${key}`;
                setTimeout(() => {
                    copyNotification.style.display = 'none';
                }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = key;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                copyNotification.style.display = 'block';
                copyNotification.textContent = `✅ Đã sao chép key: ${key}`;
                setTimeout(() => {
                    copyNotification.style.display = 'none';
                }, 2000);
            });
        }

        // ========== EVENT LISTENERS ==========
        copyBtn.addEventListener('click', copyCurrentKey);

        spamBtn.addEventListener('click', function() {
            window.open(SPAM_WEB_URL, '_blank');
        });

        // ========== CHECK KÍCH HOẠT TỪ URL ==========
        function checkActivationFromURL() {
            const params = new URLSearchParams(window.location.search);
            const key = params.get('key');
            const action = params.get('action');
            
            if (action === 'activate' && key) {
                // Xóa params trên URL
                const newUrl = window.location.pathname + window.location.hash;
                window.history.replaceState({}, document.title, newUrl);
                
                // Kích hoạt key
                const result = activateKey(key.toUpperCase());
                if (result) {
                    console.log('✅ Key đã được kích hoạt:', key);
                } else {
                    console.log('❌ Key không tồn tại:', key);
                }
                return true;
            }
            return false;
        }

        // ========== INIT ==========
        function init() {
            // Kiểm tra kích hoạt từ URL trước
            checkActivationFromURL();
            
            // Tạo key mới (mỗi lần vào web)
            createNewKey();
            
            console.log('🔑 Key mới đã được tạo:', currentKeyDisplay.textContent);
        }

        // Chạy init
        init();

    })();
</script>
</body>
</html>
